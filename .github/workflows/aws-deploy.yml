name: AWS staging deploy

on:
  push:
    branches:
      - aws-migration-branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-staging
    steps:
      - name: Skip until an AWS deploy role is configured
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        run: echo "::notice::AWS staging deployment skipped because vars.AWS_DEPLOY_ROLE_ARN is empty."

      - name: Check out the release
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Set up Node.js
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: npm ci

      - name: Build the standalone application
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: npm run build
        env:
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DATA_URL: ${{ vars.NEXT_PUBLIC_DATA_URL }}
          NEXT_PUBLIC_DATA_ANON_KEY: ${{ vars.NEXT_PUBLIC_DATA_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Package and upload release
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/aws-release"
          mkdir -p "$bundle/apps/web/.next" "$bundle/supabase" "$bundle/infra"
          cp -a apps/web/.next/standalone/. "$bundle/"
          cp -a apps/web/.next/static "$bundle/apps/web/.next/static"
          cp -a apps/web/public "$bundle/apps/web/public"
          cp -a supabase/migrations "$bundle/supabase/migrations"
          cp -a infra/aws "$bundle/infra/aws"
          test -f "$bundle/apps/web/server.js"
          tar -czf "$RUNNER_TEMP/${GITHUB_SHA}.tgz" -C "$bundle" .
          aws s3 cp "$RUNNER_TEMP/${GITHUB_SHA}.tgz" "s3://backups-cs3216/deploys/${GITHUB_SHA}.tgz" --region ap-southeast-2

      - name: Deploy through Systems Manager
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_INSTANCE_ID" ]]; then
            echo "vars.AWS_INSTANCE_ID is required when AWS deployment is enabled." >&2
            exit 1
          fi
          command_id="$(aws ssm send-command \
            --region ap-southeast-2 \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${RELEASE_SHA}" \
            --parameters "commands=/opt/app/bin/deploy.sh ${RELEASE_SHA}" \
            --query 'Command.CommandId' \
            --output text)"
          status=""
          invocation=""
          for _ in $(seq 1 60); do
            invocation="$(aws ssm get-command-invocation \
              --region ap-southeast-2 \
              --command-id "$command_id" \
              --instance-id "$AWS_INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // empty' <<<"$invocation")"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut) break ;;
            esac
            sleep 10
          done
          if [[ -z "$status" ]]; then
            echo "SSM invocation did not return a terminal status." >&2
            exit 1
          fi
          jq -r '.StandardOutputContent // ""' <<<"$invocation"
          jq -r '.StandardErrorContent // ""' <<<"$invocation" >&2
          if [[ "$status" != "Success" || "$(jq -r '.ResponseCode // 1' <<<"$invocation")" != "0" ]]; then
            echo "SSM deployment failed with status $status." >&2
            exit 1
          fi
