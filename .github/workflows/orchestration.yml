name: orchestration

on:
  push:
    branches: [main]
    paths: ['packages/orchestration/**', '.github/workflows/orchestration.yml']
  pull_request:
    paths: ['packages/orchestration/**', '.github/workflows/orchestration.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orchestration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/orchestration/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
